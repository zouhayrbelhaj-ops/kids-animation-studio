<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 استوديو الرسوم المتحركة للأطفال</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      animation: slideDown 0.6s ease-out;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      margin-bottom: 20px;
    }

    .canvas-wrapper {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 15px;
      animation: fadeIn 0.8s ease-out;
    }

    canvas {
      width: 100%;
      height: 600px;
      border-radius: 15px;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
      display: block;
      cursor: crosshair;
      border: 3px solid #667eea;
    }

    .sidebar {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      height: fit-content;
      position: sticky;
      top: 20px;
      animation: slideInRight 0.6s ease-out;
    }

    .sidebar-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 15px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .control-group {
      margin-bottom: 20px;
    }

    .control-label {
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
      display: block;
      font-size: 0.9rem;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 8px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(245, 87, 108, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
    }

    .btn-warning {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      color: white;
    }

    .btn-warning:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(250, 112, 154, 0.4);
    }

    .color-picker {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #ddd;
      outline: none;
      -webkit-appearance: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .char-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .char-btn {
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.5rem;
      text-align: center;
    }

    .char-btn:hover {
      border-color: #667eea;
      background: #f0f4ff;
      transform: scale(1.05);
    }

    .controls-bar {
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      animation: slideUp 0.6s ease-out;
    }

    .controls-bar .btn {
      flex: 1;
      min-width: 150px;
      margin-bottom: 0;
    }

    .status-bar {
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      text-align: center;
    }

    .status-item {
      padding: 10px;
      background: #f8f9ff;
      border-radius: 10px;
      border-left: 4px solid #667eea;
    }

    .status-item .label {
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 5px;
    }

    .status-item .value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #667eea;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @media (max-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .header h1 {
        font-size: 2rem;
      }
    }

    .scroll-container {
      max-height: 280px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .scroll-container::-webkit-scrollbar {
      width: 6px;
    }

    .scroll-container::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    .scroll-container::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 استوديو الرسوم المتحركة للأطفال</h1>
      <p>ارسم وحرك وأنشئ قصصك الخاصة!</p>
    </div>

    <div class="controls-bar">
      <button class="btn btn-primary" id="playBtn">▶️ تشغيل</button>
      <button class="btn btn-primary" id="pauseBtn">⏸️ إيقاف</button>
      <button class="btn btn-secondary" id="clearBtn">🗑️ مسح الكل</button>
      <button class="btn btn-warning" id="saveBtn">💾 حفظ صورة</button>
      <button class="btn btn-success" id="bgChangeBtn">🎨 تغيير الخلفية</button>
    </div>

    <div class="main-content">
      <div class="canvas-wrapper">
        <canvas id="canvas"></canvas>
      </div>

      <div class="sidebar">
        <div class="sidebar-title">⚙️ الإعدادات</div>

        <div class="control-group">
          <label class="control-label">🎭 اختر شخصية</label>
          <div class="scroll-container">
            <div class="char-grid">
              <button class="char-btn" data-char="rabbit">🐰</button>
              <button class="char-btn" data-char="cat">🐱</button>
              <button class="char-btn" data-char="dog">🐶</button>
              <button class="char-btn" data-char="duck">🦆</button>
              <button class="char-btn" data-char="pig">🐷</button>
              <button class="char-btn" data-char="bear">🐻</button>
              <button class="char-btn" data-char="lion">🦁</button>
              <button class="char-btn" data-char="monkey">🐵</button>
              <button class="char-btn" data-char="panda">🐼</button>
              <button class="char-btn" data-char="koala">🐨</button>
              <button class="char-btn" data-char="star">⭐</button>
              <button class="char-btn" data-char="heart">❤️</button>
            </div>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">🎨 لون الرسم</label>
          <input type="color" id="colorPicker" class="color-picker" value="#ff6b6b">
        </div>

        <div class="control-group">
          <label class="control-label">📏 حجم الفرشاة</label>
          <input type="range" id="brushSize" class="slider" min="2" max="50" value="10">
          <span id="sizeValue">10</span>
        </div>

        <div class="control-group">
          <label class="control-label">✨ سرعة الحركة</label>
          <input type="range" id="speed" class="slider" min="0.5" max="3" step="0.5" value="1">
          <span id="speedValue">1</span>
        </div>

        <div class="control-group">
          <button class="btn btn-secondary" id="drawingToggle">✏️ نمط الرسم</button>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-item">
        <div class="label">الأشكال المرسومة</div>
        <div class="value" id="shapeCount">0</div>
      </div>
      <div class="status-item">
        <div class="label">الشخصيات المضافة</div>
        <div class="value" id="charCount">0</div>
      </div>
      <div class="status-item">
        <div class="label">الإطارات في الثانية</div>
        <div class="value" id="fpsCounter">60</div>
      </div>
      <div class="status-item">
        <div class="label">حالة التشغيل</div>
        <div class="value" id="statusValue">جاهز</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // إعادة تعيين حجم الـ canvas
    function resizeCanvas() {
      const wrapper = canvas.parentElement;
      canvas.width = wrapper.clientWidth - 30;
      canvas.height = 600;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // المتغيرات الأساسية
    let isPlaying = true;
    let isDrawing = false;
    let drawingMode = false;
    let selectedChar = 'rabbit';
    let brushColor = '#ff6b6b';
    let brushSize = 10;
    let animationSpeed = 1;
    let shapes = [];
    let characters = [];
    let bgColor = '#87CEEB';
    let lastTime = 0;
    let frameCount = 0;
    let fps = 60;

    // كائن الشخصية
    class Character {
      constructor(x, y, emoji, color) {
        this.x = x;
        this.y = y;
        this.emoji = emoji;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 3 * animationSpeed;
        this.vy = (Math.random() - 0.5) * 3 * animationSpeed;
        this.size = 50;
        this.rotation = 0;
        this.bounce = 0;
      }

      update() {
        this.x += this.vx * animationSpeed;
        this.y += this.vy * animationSpeed;
        this.rotation += 0.05 * animationSpeed;

        // ارتداد من حواف الشاشة
        if (this.x - this.size/2 < 0 || this.x + this.size/2 > canvas.width) {
          this.vx *= -1;
        }
        if (this.y - this.size/2 < 0 || this.y + this.size/2 > canvas.height) {
          this.vy *= -1;
        }

        this.x = Math.max(this.size/2, Math.min(canvas.width - this.size/2, this.x));
        this.y = Math.max(this.size/2, Math.min(canvas.height - this.size/2, this.y));
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font = `${this.size}px Arial`;
        ctx.fillText(this.emoji, -this.size/3, this.size/3);
        
        // إضافة ظل
        ctx.fillStyle = `${this.color}44`;
        ctx.beginPath();
        ctx.arc(0, this.size/2 + 5, this.size/3, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
    }

    // كائن الشكل المرسوم
    class Shape {
      constructor(x, y, color, size) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = size;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
      }

      update() {
        this.x += this.vx * 0.5;
        this.y += this.vy * 0.5;
        this.vy += 0.1; // الجاذبية

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y > canvas.height) {
          this.y = -10;
          this.x = Math.random() * canvas.width;
        }
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // الخلفيات المختلفة
    const backgrounds = [
      '#87CEEB', // أزرق سماوي
      '#FFB6C1', // وردي فاتح
      '#98FB98', // أخضر فاتح
      '#FFE4B5', // ذهبي فاتح
      '#E6E6FA'  // بنفسجي فاتح
    ];
    let bgIndex = 0;

    // دوال الرسم الأساسية
    function drawBackground() {
      // تدرج لون جميل
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, bgColor);
      gradient.addColorStop(1, shadeColor(bgColor, -20));
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // سحب عشوائية
      drawClouds();
    }

    function drawClouds() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      
      // السحابة الأولى
      ctx.beginPath();
      ctx.arc(100, 50, 30, 0, Math.PI * 2);
      ctx.arc(140, 50, 40, 0, Math.PI * 2);
      ctx.arc(180, 50, 30, 0, Math.PI * 2);
      ctx.fill();

      // السحابة الثانية
      ctx.beginPath();
      ctx.arc(canvas.width - 100, 100, 35, 0, Math.PI * 2);
      ctx.arc(canvas.width - 60, 100, 45, 0, Math.PI * 2);
      ctx.arc(canvas.width - 20, 100, 35, 0, Math.PI * 2);
      ctx.fill();
    }

    function shadeColor(color, percent) {
      let R = parseInt(color.substring(1,3), 16);
      let G = parseInt(color.substring(3,5), 16);
      let B = parseInt(color.substring(5,7), 16);

      R = parseInt(R * (100 + percent) / 100);
      G = parseInt(G * (100 + percent) / 100);
      B = parseInt(B * (100 + percent) / 100);

      R = (R<255)?R:255;
      G = (G<255)?G:255;
      B = (B<255)?B:255;

      let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
      let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
      let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

      return "#"+RR+GG+BB;
    }

    function getEmojiForChar(char) {
      const emojiMap = {
        'rabbit': '🐰',
        'cat': '🐱',
        'dog': '🐶',
        'duck': '🦆',
        'pig': '🐷',
        'bear': '🐻',
        'lion': '🦁',
        'monkey': '🐵',
        'panda': '🐼',
        'koala': '🐨',
        'star': '⭐',
        'heart': '❤️'
      };
      return emojiMap[char] || '🐰';
    }

    // أحداث الماوس
    canvas.addEventListener('mousedown', (e) => {
      if (!drawingMode) return;
      
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (isPlaying) {
        shapes.push(new Shape(x, y, brushColor, brushSize));
      }
    });

    canvas.addEventListener('click', (e) => {
      if (drawingMode) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      characters.push(new Character(x, y, getEmojiForChar(selectedChar), brushColor));
      updateStats();
    });

    // أحداث الأزرار
    document.getElementById('playBtn').addEventListener('click', () => {
      isPlaying = true;
      document.getElementById('statusValue').textContent = 'تشغيل ▶️';
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      isPlaying = false;
      document.getElementById('statusValue').textContent = 'موقوف ⏸️';
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      shapes = [];
      characters = [];
      updateStats();
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'animation.png';
      link.href = canvas.toDataURL();
      link.click();
    });

    document.getElementById('bgChangeBtn').addEventListener('click', () => {
      bgIndex = (bgIndex + 1) % backgrounds.length;
      bgColor = backgrounds[bgIndex];
    });

    document.getElementById('drawingToggle').addEventListener('click', function() {
      drawingMode = !drawingMode;
      this.style.background = drawingMode 
        ? 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)' 
        : 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)';
      this.textContent = drawingMode ? '🖍️ نمط الرسم (مفعل)' : '✏️ نمط الرسم';
    });

    document.getElementById('colorPicker').addEventListener('change', (e) => {
      brushColor = e.target.value;
    });

    document.getElementById('brushSize').addEventListener('input', (e) => {
      brushSize = parseInt(e.target.value);
      document.getElementById('sizeValue').textContent = brushSize;
    });

    document.getElementById('speed').addEventListener('input', (e) => {
      animationSpeed = parseFloat(e.target.value);
      document.getElementById('speedValue').textContent = animationSpeed;
    });

    // أحداث الشخصيات
    document.querySelectorAll('.char-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.char-btn').forEach(b => b.style.background = 'white');
        btn.style.background = '#f0f4ff';
        selectedChar = btn.getAttribute('data-char');
      });
    });

    function updateStats() {
      document.getElementById('shapeCount').textContent = shapes.length;
      document.getElementById('charCount').textContent = characters.length;
    }

    function animate(timestamp) {
      if (lastTime === 0) lastTime = timestamp;
      const deltaTime = timestamp - lastTime;
      lastTime = timestamp;

      // حساب FPS
      frameCount++;
      if (frameCount % 30 === 0) {
        fps = Math.round(1000 / deltaTime);
        document.getElementById('fpsCounter').textContent = fps;
      }

      // الخلفية
      drawBackground();

      // تحديث وتصريح الأشكال
      if (isPlaying) {
        for (let i = shapes.length - 1; i >= 0; i--) {
          shapes[i].update();
          shapes[i].draw();
        }

        // تحديث وتصريح الشخصيات
        for (let i = characters.length - 1; i >= 0; i--) {
          characters[i].update();
          characters[i].draw();
        }
      } else {
        // حتى عند الإيقاف، ارسم الأشكال والشخصيات
        shapes.forEach(shape => shape.draw());
        characters.forEach(char => char.draw());
      }

      requestAnimationFrame(animate);
    }

    // بدء الرسم المتحرك
    requestAnimationFrame(animate);
  </script>
</body>
</html>
