<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استوديو الرسوم المتحركة للأطفال - نسخة متقدمة</title>
  <style>
    :root {
      --bg1: #7cc8ff;
      --bg2: #dff6ff;
      --panel: rgba(255,255,255,0.9);
      --primary: #5d6df5;
      --secondary: #ff7f9c;
      --success: #4cc9a8;
      --warning: #f9b652;
      --text: #1d2340;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #6477ff, #8ac7ff 35%, #d5f0ff);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      max-width: 1480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }

    .panel {
      background: var(--panel);
      border-radius: 24px;
      box-shadow: 0 18px 60px rgba(21, 34, 68, 0.22);
      border: 2px solid rgba(255,255,255,0.72);
      backdrop-filter: blur(6px);
    }

    .studio {
      padding: 18px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 10px 18px rgba(0,0,0,0.08);
      color: white;
      font-size: 0.96rem;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .primary { background: linear-gradient(135deg, #5d6df5, #7b8cff); }
    .secondary { background: linear-gradient(135deg, #ff7f9c, #f45c8f); }
    .success { background: linear-gradient(135deg, #3ec9a5, #41d4b6); }
    .warning { background: linear-gradient(135deg, #ffb454, #ff9d40); }
    .dark { background: linear-gradient(135deg, #3c4f80, #1c2b46); }
    .ghost { background: linear-gradient(135deg, #a7b4ff, #7aa9ff); }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .title {
      font-size: clamp(1.5rem, 2vw, 2.4rem);
      font-weight: 900;
      color: #1c2f5d;
    }

    .status {
      background: rgba(93,109,245,0.1);
      border: 1px solid rgba(93,109,245,0.25);
      color: #243a80;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
    }

    .canvas-wrap {
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.8);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.25);
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    canvas {
      width: 100%;
      height: 620px;
      display: block;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      cursor: crosshair;
    }

    .sidebar {
      padding: 18px;
    }

    .group {
      margin-bottom: 18px;
    }

    .label {
      display: block;
      font-weight: 800;
      margin-bottom: 8px;
      color: #2b3c66;
      font-size: 0.98rem;
    }

    .color-input {
      width: 100%;
      height: 42px;
      border: 2px solid #dfe8ff;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .value-tag {
      min-width: 30px;
      text-align: center;
      font-weight: 800;
      color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .emoji-btn,
    .shape-btn {
      border: 2px solid #dfe7ff;
      background: #f7f9ff;
      border-radius: 12px;
      min-height: 52px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .emoji-btn:hover,
    .shape-btn:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      background: #edf2ff;
    }

    .emoji-btn.active,
    .shape-btn.active {
      background: #edf2ff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(93,109,245,0.12);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .stat-card {
      background: linear-gradient(135deg, #edf3ff, #f5f8ff);
      border: 1px solid #dfe7ff;
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-label {
      display: block;
      color: #7587b5;
      font-size: 0.74rem;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--primary);
    }

    .toggle-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toggle-row .btn {
      flex: 1 1 110px;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 1fr;
      }

      canvas {
        height: 520px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel studio">
      <div class="header">
        <div class="title">🎬 استوديو الرسوم المتحركة للأطفال</div>
        <div class="status" id="statusBadge">جاهز للرسوم</div>
      </div>

      <div class="toolbar">
        <button class="btn primary" id="playBtn">▶️ تشغيل</button>
        <button class="btn primary" id="pauseBtn">⏸️ إيقاف</button>
        <button class="btn secondary" id="clearBtn">🗑️ مسح</button>
        <button class="btn success" id="savePngBtn">💾 حفظ صورة</button>
        <button class="btn warning" id="recordBtn">🎥 تسجيل فيديو</button>
        <button class="btn dark" id="themeBtn">🎨 خلفية</button>
        <button class="btn ghost" id="soundBtn">🔊 صوت</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="scene" width="1200" height="620"></canvas>
      </div>
    </div>

    <aside class="panel sidebar">
      <div class="group">
        <label class="label">🎭 اختر شخصية</label>
        <div class="grid" id="emojiGrid">
          <button class="emoji-btn active" data-char="rabbit">🐰</button>
          <button class="emoji-btn" data-char="cat">🐱</button>
          <button class="emoji-btn" data-char="dog">🐶</button>
          <button class="emoji-btn" data-char="duck">🦆</button>
          <button class="emoji-btn" data-char="pig">🐷</button>
          <button class="emoji-btn" data-char="bear">🐻</button>
          <button class="emoji-btn" data-char="lion">🦁</button>
          <button class="emoji-btn" data-char="panda">🐼</button>
          <button class="emoji-btn" data-char="koala">🐨</button>
        </div>
      </div>

      <div class="group">
        <label class="label">🔷 شكل جديد</label>
        <div class="grid" id="shapeGrid">
          <button class="shape-btn active" data-shape="circle">◯</button>
          <button class="shape-btn" data-shape="square">▣</button>
          <button class="shape-btn" data-shape="triangle">△</button>
          <button class="shape-btn" data-shape="star">★</button>
          <button class="shape-btn" data-shape="heart">❤</button>
          <button class="shape-btn" data-shape="bubble">◔</button>
        </div>
      </div>

      <div class="group">
        <label class="label">🎨 لون</label>
        <input type="color" class="color-input" id="colorPicker" value="#ff6d8c" />
      </div>

      <div class="group">
        <label class="label">📏 حجم الفرشاة</label>
        <div class="range-wrap">
          <input type="range" id="brushSize" min="4" max="40" value="12" />
          <span class="value-tag" id="sizeLabel">12</span>
        </div>
      </div>

      <div class="group">
        <label class="label">⚡ سرعة الحركة</label>
        <div class="range-wrap">
          <input type="range" id="speedSlider" min="0.5" max="3" step="0.5" value="1" />
          <span class="value-tag" id="speedLabel">1</span>
        </div>
      </div>

      <div class="group">
        <label class="label">🖍️ نوع الرسم</label>
        <div class="toggle-row">
          <button class="btn dark" id="drawToggle">رسم حر</button>
          <button class="btn ghost" id="addShapeBtn">إضافة شكل</button>
        </div>
      </div>

      <div class="group">
        <label class="label">📊 الإحصائيات</label>
        <div class="stats">
          <div class="stat-card">
            <span class="stat-label">الأشكال</span>
            <span class="stat-value" id="shapeCount">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">الشخصيات</span>
            <span class="stat-value" id="charCount">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">FPS</span>
            <span class="stat-value" id="fpsValue">60</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">الحالة</span>
            <span class="stat-value" id="modeValue">حركة</span>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const statusBadge = document.getElementById('statusBadge');

    const backgrounds = ['#8ed8ff', '#ffc7d8', '#b6f0d0', '#ffedb4', '#d7ccff'];
    const characters = [];
    const shapes = [];
    const freehandPaths = [];

    let bgIndex = 0;
    let selectedChar = 'rabbit';
    let selectedShape = 'circle';
    let brushColor = '#ff6d8c';
    let brushSize = 12;
    let motionSpeed = 1;
    let isPlaying = true;
    let drawingMode = false;
    let isRecording = false;
    let recordingStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let lastPointer = null;
    let lastFrameTime = 0;
    let frameCounter = 0;
    let fps = 60;
    let audioEnabled = false;
    let audioContext = null;

    function createAudioContext() {
      if (!audioEnabled) return;
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq = 440, duration = 0.12, type = 'sine', gainValue = 0.025) {
      if (!audioEnabled) return;
      createAudioContext();
      if (!audioContext) return;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = gainValue;
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + duration);
    }

    function renderBackground() {
      const bg = backgrounds[bgIndex % backgrounds.length];
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, bg);
      gradient.addColorStop(1, shadeColor(bg, -18));
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      drawCloud(130, 80, 62);
      drawCloud(canvas.width - 210, 120, 70);
      drawCloud(canvas.width / 2 - 60, 90, 52);

      ctx.fillStyle = '#ffd867';
      ctx.beginPath();
      ctx.arc(canvas.width - 120, 100, 52, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#78c66b';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 140);
      ctx.quadraticCurveTo(220, canvas.height - 250, 430, canvas.height - 140);
      ctx.quadraticCurveTo(680, canvas.height - 210, canvas.width, canvas.height - 150);
      ctx.lineTo(canvas.width, canvas.height);
      ctx.lineTo(0, canvas.height);
      ctx.closePath();
      ctx.fill();
    }

    function drawCloud(x, y, radius) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.arc(x + radius * 0.9, y - radius * 0.3, radius * 0.8, 0, Math.PI * 2);
      ctx.arc(x + radius * 1.8, y, radius * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }

    function shadeColor(hex, amount) {
      const num = parseInt(hex.slice(1), 16);
      let r = (num >> 16) + amount;
      let g = ((num >> 8) & 0x00ff) + amount;
      let b = (num & 0x0000ff) + amount;
      r = Math.min(255, Math.max(0, r));
      g = Math.min(255, Math.max(0, g));
      b = Math.min(255, Math.max(0, b));
      return '#' + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
    }

    function getEmoji(key) {
      const map = {
        rabbit: '🐰',
        cat: '🐱',
        dog: '🐶',
        duck: '🦆',
        pig: '🐷',
        bear: '🐻',
        lion: '🦁',
        panda: '🐼',
        koala: '🐨'
      };
      return map[key] || '🐰';
    }

    function addCharacter(x, y) {
      const char = {
        x, y,
        emoji: getEmoji(selectedChar),
        size: 62,
        vx: (Math.random() - 0.5) * 2.3 * motionSpeed,
        vy: (Math.random() - 0.5) * 2.3 * motionSpeed,
        wobble: Math.random() * Math.PI * 2,
        color: brushColor,
        type: 'character'
      };
      characters.push(char);
      updateStats();
      playTone(600, 0.08, 'triangle', 0.02);
    }

    function addShapeObj(x, y) {
      const kind = selectedShape;
      const shape = {
        x, y,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        size: 26 + Math.random() * 18,
        color: brushColor,
        kind,
        rotation: Math.random() * Math.PI,
        type: 'shape'
      };
      shapes.push(shape);
      updateStats();
      playTone(420, 0.09, 'square', 0.02);
    }

    function addFreehandPoint(x, y) {
      if (!freehandPaths.length) {
        freehandPaths.push({ color: brushColor, size: brushSize, points: [] });
      }
      const path = freehandPaths[freehandPaths.length - 1];
      path.points.push({ x, y });
    }

    function startNewFreehand() {
      freehandPaths.push({ color: brushColor, size: brushSize, points: [] });
    }

    function drawFreehandPaths() {
      freehandPaths.forEach(path => {
        if (path.points.length < 2) return;
        ctx.strokeStyle = path.color;
        ctx.lineWidth = path.size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(path.points[0].x, path.points[0].y);
        for (let i = 1; i < path.points.length; i++) {
          ctx.lineTo(path.points[i].x, path.points[i].y);
        }
        ctx.stroke();
      });
    }

    function drawCharacter(character) {
      ctx.save();
      ctx.translate(character.x, character.y);
      ctx.rotate(Math.sin(character.wobble) * 0.25);
      ctx.font = `${character.size}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(character.emoji, 0, 0);
      ctx.restore();
    }

    function drawShape(shape) {
      ctx.save();
      ctx.translate(shape.x, shape.y);
      ctx.rotate(shape.rotation);
      ctx.fillStyle = shape.color;
      ctx.strokeStyle = shadeColor(shape.color, 18);
      ctx.lineWidth = 2;

      switch (shape.kind) {
        case 'circle':
          ctx.beginPath();
          ctx.arc(0, 0, shape.size, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'square':
          ctx.fillRect(-shape.size, -shape.size, shape.size * 2, shape.size * 2);
          break;
        case 'triangle':
          ctx.beginPath();
          ctx.moveTo(0, -shape.size);
          ctx.lineTo(shape.size, shape.size);
          ctx.lineTo(-shape.size, shape.size);
          ctx.closePath();
          ctx.fill();
          break;
        case 'star':
          drawStar(0, 0, shape.size, shape.size * 0.5, 5);
          break;
        case 'heart':
          drawHeart(0, 0, shape.size);
          break;
        case 'bubble':
          ctx.beginPath();
          ctx.arc(0, 0, shape.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.beginPath();
          ctx.arc(shape.size * 0.32, -shape.size * 0.22, shape.size * 0.18, 0, Math.PI * 2);
          ctx.fill();
          break;
      }
      ctx.restore();
    }

    function drawStar(cx, cy, outerRadius, innerRadius, spikes) {
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        const angle = (Math.PI / spikes) * i - Math.PI / 2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawHeart(cx, cy, size) {
      ctx.beginPath();
      ctx.moveTo(cx, cy + size * 0.5);
      ctx.bezierCurveTo(cx, cy - size * 0.15, cx - size, cy - size * 0.3, cx - size * 0.65, cy - size * 0.1);
      ctx.bezierCurveTo(cx - size, cy + size * 0.4, cx, cy + size * 0.8, cx, cy + size * 1.1);
      ctx.bezierCurveTo(cx, cy + size * 0.8, cx + size, cy + size * 0.4, cx + size * 0.65, cy - size * 0.1);
      ctx.bezierCurveTo(cx + size, cy - size * 0.3, cx, cy - size * 0.15, cx, cy + size * 0.5);
      ctx.fill();
    }

    function updateCharacters() {
      characters.forEach((char) => {
        char.x += char.vx * motionSpeed;
        char.y += char.vy * motionSpeed;
        char.wobble += 0.09 * motionSpeed;

        if (char.x < 40 || char.x > canvas.width - 40) char.vx *= -1;
        if (char.y < 40 || char.y > canvas.height - 40) char.vy *= -1;

        char.x = Math.max(40, Math.min(canvas.width - 40, char.x));
        char.y = Math.max(40, Math.min(canvas.height - 40, char.y));
      });
    }

    function updateShapes() {
      shapes.forEach((shape) => {
        shape.x += shape.vx * motionSpeed;
        shape.y += shape.vy * motionSpeed;
        shape.rotation += 0.025 * motionSpeed;

        if (shape.x < -50 || shape.x > canvas.width + 50) shape.vx *= -1;
        if (shape.y < -50 || shape.y > canvas.height + 50) shape.vy *= -1;
      });
    }

    function updateStats() {
      document.getElementById('shapeCount').textContent = shapes.length;
      document.getElementById('charCount').textContent = characters.length;
    }

    function render() {
      renderBackground();
      drawFreehandPaths();
      shapes.forEach(drawShape);
      characters.forEach(drawCharacter);
    }

    function animate(ts) {
      if (!lastFrameTime) lastFrameTime = ts;
      const delta = ts - lastFrameTime || 16;
      lastFrameTime = ts;

      frameCounter++;
      if (frameCounter % 20 === 0) {
        fps = Math.round(1000 / delta);
        document.getElementById('fpsValue').textContent = fps;
      }

      if (isPlaying) {
        updateCharacters();
        updateShapes();
      }

      render();
      requestAnimationFrame(animate);
    }

    function setStatus(text) {
      statusBadge.textContent = text;
      document.getElementById('modeValue').textContent = isPlaying ? 'حركة' : 'توقف';
    }

    function startRecording() {
      if (isRecording) return;
      try {
        recordingStream = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(recordingStream, { mimeType: 'video/webm;codecs=vp9' });
        recordedChunks = [];
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'kids-animation.webm';
          a.click();
          URL.revokeObjectURL(url);
          isRecording = false;
          document.getElementById('recordBtn').textContent = '🎥 تسجيل فيديو';
          setStatus('تم حفظ الفيديو');
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recordBtn').textContent = '⏹️ إيقاف التسجيل';
        setStatus('جاري تسجيل الفيديو');
      } catch (err) {
        setStatus('المتصفح لا يدعم التسجيل');
      }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
      }
    }

    const palette = document.getElementById('colorPicker');
    palette.addEventListener('input', (e) => {
      brushColor = e.target.value;
    });

    document.getElementById('brushSize').addEventListener('input', (e) => {
      brushSize = Number(e.target.value);
      document.getElementById('sizeLabel').textContent = brushSize;
    });

    document.getElementById('speedSlider').addEventListener('input', (e) => {
      motionSpeed = Number(e.target.value);
      document.getElementById('speedLabel').textContent = motionSpeed;
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      isPlaying = true;
      setStatus('قيد الحركة');
      playTone(600, 0.08, 'sine', 0.015);
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      isPlaying = false;
      setStatus('متوقف');
      playTone(220, 0.08, 'square', 0.015);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      shapes.length = 0;
      characters.length = 0;
      freehandPaths.length = 0;
      updateStats();
      setStatus('تم مسح المشهد');
      playTone(300, 0.1, 'triangle', 0.017);
    });

    document.getElementById('savePngBtn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'kids-animation.png';
      a.click();
      setStatus('تم حفظ الصورة');
      playTone(520, 0.1, 'sine', 0.02);
    });

    document.getElementById('recordBtn').addEventListener('click', () => {
      if (isRecording) stopRecording();
      else startRecording();
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      bgIndex = (bgIndex + 1) % backgrounds.length;
      setStatus('تم تغيير الخلفية');
      playTone(470, 0.09, 'triangle', 0.02);
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      document.getElementById('soundBtn').textContent = audioEnabled ? '🔇 صوت' : '🔊 صوت';
      setStatus(audioEnabled ? 'الصوت مفعل' : 'الصوت متوقف');
      if (audioEnabled) createAudioContext();
    });

    document.getElementById('drawToggle').addEventListener('click', () => {
      drawingMode = !drawingMode;
      document.getElementById('drawToggle').textContent = drawingMode ? 'رسم حر مفعل' : 'رسم حر';
      setStatus(drawingMode ? 'وضع الرسم الحر' : 'وضع الحركة');
    });

    document.getElementById('addShapeBtn').addEventListener('click', () => {
      const x = canvas.width * (0.2 + Math.random() * 0.6);
      const y = canvas.height * (0.2 + Math.random() * 0.6);
      addShapeObj(x, y);
      setStatus('تمت إضافة شكل');
    });

    document.querySelectorAll('.emoji-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedChar = btn.dataset.char;
      });
    });

    document.querySelectorAll('.shape-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedShape = btn.dataset.shape;
      });
    });

    canvas.addEventListener('click', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      if (drawingMode) {
        addShapeObj(x, y);
      } else {
        addCharacter(x, y);
      }
    });

    canvas.addEventListener('pointerdown', (event) => {
      if (!drawingMode) return;
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      lastPointer = { x, y };
      startNewFreehand();
      addFreehandPoint(x, y);
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!drawingMode || !lastPointer) return;
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const dx = x - lastPointer.x;
      const dy = y - lastPointer.y;
      if (Math.hypot(dx, dy) > 2) {
        addFreehandPoint(x, y);
        lastPointer = { x, y };
      }
    });

    canvas.addEventListener('pointerup', () => {
      lastPointer = null;
      if (freehandPaths.length && freehandPaths[freehandPaths.length - 1].points.length > 0) {
        setStatus('تم رسم خط جديد');
      }
    });

    updateStats();
    setStatus('جاهز للرسوم');
    render();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
